<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماكولات الزين - شاورما</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- قسم الهيدر باللوجو والاسم -->
  <header class="header">
    <div class="logo-wrapper">
      <img src="images/logo.png" alt="شاورما الزين" class="main-logo" onerror="this.style.display='none'">
    </div>
    <h1>شاورما الزين</h1>
    <p>أطيب الوجبات الغربية والشاورما - اضغط للطلب مباشرة عبر الواتساب</p>
  </header>

  <!-- أزرار التصفية (Categories) -->
  <nav class="categories">
    <button class="cat-btn active" onclick="filterMenu('all')">الكل</button>
    <button class="cat-btn" onclick="filterMenu('meals')">الوجبات</button>
    <button class="cat-btn" onclick="filterMenu('sandwiches')">السندويش</button>
  </nav>

  <!-- حاوية عرض المنيو -->
  <main class="container">
    <div id="menu-container" class="menu-grid"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
